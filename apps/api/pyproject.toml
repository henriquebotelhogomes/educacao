[project]
name = "mentora-api"
version = "0.1.0"
description = "API FastAPI do Mentora AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<24",
    "authlib>=1.3,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=0.3,<0.4",
    "langchain-groq>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "minio>=7.2,<8",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "opentelemetry-sdk>=1.29,<2",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "PyJWT>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "qdrant-client>=1.14,<1.15",
    "sentence-transformers>=3.0,<4",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
